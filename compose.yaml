services:
  mongodb:
    image: mongo:7.0
    container_name: hu01-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hu01_productos
    volumes:
      - mongo_data:/data/db

  sonarqube:
    image: sonarqube:community
    container_name: hu01-sonarqube
    depends_on:
      - mongodb
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

volumes:
  mongo_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
